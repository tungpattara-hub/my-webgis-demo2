<!DOCTYPE HTML>
<html>
<head>
<meta charset="UTF-8">
<title>Web Map</title>
<style type="text/css">
  html { height: 100%; }
  body { margin: 0px; height: 100%; }
  #map { height: 100%; }
</style>
<script type="text/javascript" src="https://api.longdo.com/map3/?key=9bd2ac038108ec5023405cf9f20252fb"></script>
<script>
    var map
    function init() {
      map = new longdo.Map({
          layer: [longdo.Layers.NORMAL, longdo.Layers.TRAFFIC],
          zoom: 10,

          location: {
              lon: 100.5351375,
              lat: 13.767734
          },
          placeholder: document.getElementById('map'),
          ui: longdo.UiComponent.None,
          lastView: true
      });
    }
</script>
</head>
<body onload="init();">
    <div id="map"></div>
</body>
</html>
