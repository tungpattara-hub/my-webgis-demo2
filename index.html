<!DOCTYPE HTML>
<html>
<head>
<meta charset="UTF-8">
<title>Create Map Sample | Longdo Map</title>
<style type="text/css">
  html { height: 100%; }
  body { margin: 0px; height: 100%; }
  #map { height: 100%; }
</style>
<script type="text/javascript" src="https://api.longdo.com/map3/?key=9bd2ac038108ec5023405cf9f20252fb"></script>
<script>
    var map
    function initOption() {
      map = new longdo.Map({
        layer: [longdo.Layers.NORMAL, longdo.Layers.TRAFFIC],
        zoom: 10,
        zoomRange: {
          min: 9,
          max: 11
        },
        location: {
          lon: 102.912618,
          lat: 15.879704
        },
        placeholder: document.getElementById('map'),
        ui: longdo.UiComponent.None,
        lastView: false
      });
    }
</script>
</head>
<body onload="init();">
    <div id="map"></div>
</body>
</html>
